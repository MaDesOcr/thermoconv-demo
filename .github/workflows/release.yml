name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      - name: Le tag correspond-il à package.json ?
        run: |
          attendu="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$attendu" ] || { echo "::error::$GITHUB_REF_NAME ≠ $attendu"; exit 1; }
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ThermoConv $GITHUB_REF_NAME" --generate-notes --verify-tag
